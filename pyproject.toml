[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streamshield-mlops"
version = "0.1.0"
description = "High-Throughput Real-Time Event-Driven Streaming MLOps Platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Muhammad Zainur" }
]
dependencies = [
    "feast[redis]>=0.40.0",
    "duckdb>=0.10.0",
    "pyarrow>=16.0.0",
    "aiokafka>=0.10.0",
    "kafka-python-ng>=2.2.0",
    "redis>=5.0.0",
    "onnxruntime>=1.18.0",
    "skl2onnx>=1.16.0",
    "lightgbm>=4.3.0",
    "scikit-learn>=1.4.0",
    "evidently>=0.4.25",
    "prometheus-client>=0.20.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "streamlit>=1.35.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    "locust>=2.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
