version: '3.8'

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2
    container_name: streamshield-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"

  redis:
    image: redis:7.2-alpine
    container_name: streamshield-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: streamshield-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
